<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Hospital Management System</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="style.css" rel="stylesheet">
</head>
<body>
<div id="toasts" class="position-fixed top-0 end-0 p-3" style="z-index:1080"></div>

<section id="login-view" class="container py-5">
  <div class="row justify-content-center"><div class="col-12 col-sm-8 col-md-5">
    <h1 class="h3 mb-1">Hospital Management System</h1>
    <p class="text-muted">Sign in to manage patients, doctors and appointments.</p>
    <form id="login-form" novalidate class="card card-body">
      <div class="mb-3"><label class="form-label" for="email">Email</label><input id="email" type="email" class="form-control" required></div>
      <div class="mb-3"><label class="form-label" for="password">Password</label><input id="password" type="password" class="form-control" minlength="6" required></div>
      <div class="d-flex gap-2"><button class="btn btn-primary flex-fill" type="submit">Sign in</button>
        <button class="btn btn-outline-secondary flex-fill" type="button" id="register-btn">Create account</button></div>
      <small class="text-muted mt-3">The first account created becomes the admin.</small>
    </form>
  </div></div>
</section>

<main id="app-view" class="d-none">
  <nav class="navbar navbar-dark bg-hms">
    <div class="container-fluid"><span class="navbar-brand">HMS</span>
      <div class="text-white"><span id="role-badge" class="badge bg-light text-dark me-2"></span><button id="logout" class="btn btn-sm btn-outline-light">Sign out</button></div></div>
  </nav>
  <div class="container-fluid py-3">
    <ul class="nav nav-tabs mb-3" id="tabs">
      <li class="nav-item"><button class="nav-link active" data-r="patients">Patients</button></li>
      <li class="nav-item"><button class="nav-link" data-r="doctors">Doctors</button></li>
      <li class="nav-item"><button class="nav-link" data-r="appointments">Appointments</button></li>
    </ul>
    <div class="row g-3">
      <div class="col-12 col-lg-4">
        <form id="entity-form" novalidate class="card card-body">
          <h2 class="h5" id="form-title"></h2>
          <div id="form-fields"></div>
          <div class="d-flex gap-2 mt-2"><button class="btn btn-primary" type="submit">Save</button>
            <button class="btn btn-outline-secondary" type="button" id="cancel-btn">Clear</button></div>
        </form>
      </div>
      <div class="col-12 col-lg-8">
        <input id="search" class="form-control mb-2" placeholder="Search this table">
        <div class="table-responsive"><table class="table table-hover align-middle bg-white">
          <thead id="thead"></thead><tbody id="tbody"></tbody></table></div>
      </div>
    </div>
  </div>
</main>
<script type="module" src="js/app.js"></script>
</body>
</html>
